name: CodSpeed

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

jobs:
  Benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Real-world corpus for the generate benchmarks (markdown only).
      - run: git clone --depth 1 -b skeptic-test https://github.com/djc/rust-cookbook ../rust-cookbook
      - run: cargo install cargo-codspeed --locked
      # Only the in-process `generate` target: simulation mode counts this
      # process's instructions and cannot see child rustc processes. The
      # `rt` target runs locally with `cargo bench --bench rt`.
      - run: cargo codspeed build --bench generate
        working-directory: benches
      - uses: CodSpeedHQ/action@v3
        env:
          COOKBOOK_DIR: ${{ github.workspace }}/../rust-cookbook
        with:
          working-directory: benches
          run: cargo codspeed run generate
          token: ${{ secrets.CODSPEED_TOKEN }}

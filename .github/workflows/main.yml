name: CI

on:
  push:
    branches: ['master']
  pull_request:

jobs:
  Test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, 1.56.0]
        exclude:
          - os: macos-latest
            rust: beta
          - os: macos-latest
            rust: 1.56.0
          - os: windows-latest
            rust: beta
          - os: windows-latest
            rust: 1.56.0

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Setup Windows environment
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # Install missing Windows SDK components
          $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          Write-Host "Available Windows SDK versions:"
          if (Test-Path $sdkPath) {
            Get-ChildItem $sdkPath | Where-Object { $_.PSIsContainer } | ForEach-Object { Write-Host $_.Name }
          }
          
          # Find the latest available Windows SDK
          $latestSdk = Get-ChildItem "$sdkPath" | Where-Object { $_.PSIsContainer -and $_.Name -like "10.0.*" } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latestSdk) {
            $sdkVersion = $latestSdk.Name
            Write-Host "Using Windows SDK version: $sdkVersion"
            $libPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\$sdkVersion\um\x64;${env:ProgramFiles(x86)}\Windows Kits\10\Lib\$sdkVersion\ucrt\x64"
            echo "LIB=$libPath;$env:LIB" >> $env:GITHUB_ENV
          } else {
            Write-Host "No Windows SDK found, using default"
          }
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all-targets
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all # MSRV: --workspace is not supported yet

  Integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - run: cd .. &&
          git clone -b master https://github.com/rust-lang-nursery/rust-cookbook &&
          cd rust-cookbook &&
          cargo test

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
      - uses: actions-rs/cargo@v1
        if: always()
        with:
          command: clippy
          args: --workspace --all-targets -- -D warnings

  Audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: EmbarkStudios/cargo-deny-action@v1

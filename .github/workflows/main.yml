name: CI

on:
  push:
    branches: ['master']
  pull_request:

jobs:
  Test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, 1.56.0]
        exclude:
          - os: macos-latest
            rust: beta
          - os: macos-latest
            rust: 1.56.0
          - os: windows-latest
            rust: beta
          - os: windows-latest
            rust: 1.56.0

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Setup Windows environment
        if: matrix.os == 'windows-latest'
        run: |
          # Ensure we have the latest Windows SDK
          echo "Using Windows SDK from Visual Studio"
          # Add Windows SDK lib path to environment
          echo "LIB=%ProgramFiles(x86)%\Windows Kits\10\Lib\10.0.22000.0\um\x64;%ProgramFiles(x86)%\Windows Kits\10\Lib\10.0.22000.0\ucrt\x64;%LIB%" >> $GITHUB_ENV
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --all-targets
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all # MSRV: --workspace is not supported yet

  Integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - run: cd .. &&
          git clone -b master https://github.com/rust-lang-nursery/rust-cookbook &&
          cd rust-cookbook &&
          cargo test

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
      - uses: actions-rs/cargo@v1
        if: always()
        with:
          command: clippy
          args: --workspace --all-targets -- -D warnings

  Audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: EmbarkStudios/cargo-deny-action@v1
